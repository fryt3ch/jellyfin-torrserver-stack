services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${JELLYFIN_CONFIG:-./data/jellyfin/config}:/config
      - ${DOWNLOADS_PATH:-./data/downloads}:/mnt/downloads
    networks:
      - jellyfin-net
    # Expose Jellyfin directly if you are not using a reverse proxy.
    #ports:
    #  - 8096:8096
    restart: unless-stopped

  torrserver:
    image: yourok/torrserver:latest
    container_name: torrserver
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${TORRSERVER_DATA:-./data/torrserver}:/opt/torrserver
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    networks:
      jellyfin-net:
        aliases:
          - torrserver
    # Expose TorrServer directly if Jellyfin and clients need LAN access
    # and you are not using the VPN profile.
    #ports:
    #  - "8090:8090"
    restart: unless-stopped

networks:
  jellyfin-net:
    external: true
